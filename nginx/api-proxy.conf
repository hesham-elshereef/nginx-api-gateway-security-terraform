server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        proxy_pass https://bywr2o2c5a.execute-api.eu-central-1.amazonaws.com/;

        proxy_ssl_server_name on;

        proxy_set_header Host bywr2o2c5a.execute-api.eu-central-1.amazonaws.com;

        proxy_set_header X-Environment "dev";
        proxy_set_header X-Student-ID "STU12345";
        proxy_set_header X-Internal-Token "SECRET";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
